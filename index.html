<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Caveat:wght@500;600;700&family=Inter+Tight:wght@100..900&display=swap" rel="stylesheet">
<style>
@property --mt{syntax:'<length>';inherits:true;initial-value:0px}
@property --m0{syntax:'<length>';inherits:true;initial-value:0px}
@property --mb{syntax:'<length>';inherits:true;initial-value:0px}
@property --ms{syntax:'<length>';inherits:true;initial-value:0px}

:root{
  --green-900:#0b2f20;--green-800:#11402c;--green-700:#1a5a40;--mint:#cfeee0;--ink:#0d0f0e;
  --n:min(calc(100vw / 1440),calc(100vh / 900));
  --glide:1.6s;--mbs:.2;--th:180px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;background:var(--green-900);color:#fff;
  font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- stage + frame ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#0c3523 0%,#14503a 45%,#9fd8bf 100%)}
.bg{position:absolute;inset:0;background:url("paris-bg.jpg") 50% 50%/cover no-repeat}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,30,.12) 0%,rgba(10,10,30,0) 40%)}
.bg-case{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,rgba(10,6,24,.15),rgba(10,6,24,.55));opacity:0;transition:opacity 1.6s}
.stage.m-case .bg-case{opacity:1}
.plate{display:none!important}
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;will-change:transform}
.frame.glide{transition:transform var(--glide) cubic-bezier(.65,0,.35,1),--m0 var(--glide) cubic-bezier(.65,0,.35,1),--mt var(--glide) cubic-bezier(.65,0,.35,1),--mb var(--glide) cubic-bezier(.65,0,.35,1),--ms var(--glide) cubic-bezier(.65,0,.35,1)}
.d-fade.m-case{--mt:110px;--mb:60px;--ms:170px}
.m-fade{--mt:190px;--ms:140px}
.m-fade.m-case{--m0:48px;--mt:40px;--mb:70px;--ms:140px}

.plate,.trans,.caseplate{
  -webkit-mask-image:
    linear-gradient(180deg,transparent calc(var(--o,0px) + var(--m0)),rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt)*.37),#000 calc(var(--o,0px) + var(--m0) + var(--mt)),#000 calc(100% - var(--ob,0px) - var(--mb)),transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(180deg,transparent calc(var(--o,0px) + var(--m0)),rgba(0,0,0,.35) calc(var(--o,0px) + var(--m0) + var(--mt)*.37),#000 calc(var(--o,0px) + var(--m0) + var(--mt)),#000 calc(100% - var(--ob,0px) - var(--mb)),transparent calc(100% - var(--ob,0px))),
    linear-gradient(90deg,transparent 0,#000 var(--ms),#000 calc(100% - var(--ms)),transparent 100%);
  mask-composite:intersect;
}
.plate{position:absolute;left:0;top:-73.125px;width:1440px;height:956.25px;display:block;--o:73.125px;--ob:73.125px}
.cut{position:absolute;left:416px;top:120px;width:591px;height:760px;display:block;z-index:4;pointer-events:none;transform-origin:50% 100%;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
@media (max-width:820px){.cut{left:501px}}
.wm{position:absolute;left:0;top:0;width:1440px;height:260px;overflow:visible;z-index:3}
.wm text,.m-wm text{font-family:'Inter Tight',sans-serif;font-weight:900;font-size:268px;letter-spacing:-6px}
.script{position:absolute;top:148px;left:200px;z-index:6;font-family:'Caveat Brush',cursive;font-size:82px;line-height:1;color:#fff;
  letter-spacing:-.5px;transform:rotate(-8deg);transform-origin:0 50%;text-shadow:0 2px 14px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none}
.trans{position:absolute;inset:0;width:1440px;height:810px;object-fit:cover;opacity:0;z-index:6;--o:0px;--ob:0px;pointer-events:none}
.caseplate{position:absolute;left:0;top:-105.47px;width:1440px;height:956.25px;opacity:0;z-index:7;--o:105.47px;--ob:40.78px;pointer-events:none;filter:drop-shadow(0 30px 45px rgba(0,0,0,.55))}
.desc,.nav-case{text-shadow:0 2px 12px rgba(0,0,0,.55)}

/* ---------- badge ---------- */
.badge{position:absolute;left:986px;top:-165px;width:582px;height:1030px;transform-origin:288px 0;z-index:5;pointer-events:none}
.badge .string{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.badge .string path{fill:none;stroke:#f3e6d3;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.bcard{position:absolute;left:143px;top:470px;width:290px;height:435px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2)}
.bcard>img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:4px}
.bc-photo{position:absolute;left:10.9%;top:29.85%;width:41.6%;height:28.5%;transform:rotate(-3deg);background:#dfe4e1 55% 30%/cover no-repeat}
.bcard .pin{position:absolute;left:50%;top:-30px;width:20px;height:50px;margin-left:-10px;border-radius:3px;
  background:linear-gradient(90deg,#c99a63,#e7c08a 45%,#b8854f);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.bcard .pin::after{content:'';position:absolute;left:3px;right:3px;top:22px;height:6px;border-radius:50%;background:#8b8f94}
.card{position:absolute;left:172px;top:536px;width:238px;height:392px;padding:20px 16px 0 16px;color:#141615;font-family:'Inter Tight',sans-serif}
.card h4{margin:0;font-size:30px;line-height:.95;font-weight:800;letter-spacing:-.5px}
.card .yr{position:absolute;right:16px;top:62px;font-size:11px;font-weight:700}
.card .role{margin-top:12px;padding-top:5px;border-top:1px solid #222;font-size:9.5px;font-weight:700;letter-spacing:.2px}
.card .ph{width:92px;height:112px;margin:12px auto;border-radius:6px;background:#dfe4e1 center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  display:grid;place-items:center;text-align:center;color:#8a948f;font-size:8px;font-weight:700;letter-spacing:.1em}
.card .ph b{display:block;font-size:30px;color:#e5566f;line-height:1;margin-bottom:4px}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;font-size:9px;font-weight:700;padding:6px 0 3px;border-bottom:1.5px dotted #333}
.card .row b{font-weight:600;text-align:right}
.badge .hit{position:absolute;left:143px;top:440px;width:290px;height:470px;pointer-events:auto;cursor:grab}

/* ---------- laptop screen / bookshelf ---------- */
.screen{position:absolute;left:272.8px;top:102.7px;width:894.4px;height:604.7px;border-radius:3px;background:#000;overflow:hidden;opacity:0;z-index:8;pointer-events:none}
.is-case .screen{pointer-events:auto}
.screen::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:2;pointer-events:none}

.shelf{position:absolute;inset:0;z-index:1;overflow:hidden;font-family:'Inter Tight',sans-serif;
  background:
    radial-gradient(60% 55% at 50% 16%,rgba(255,196,120,.30),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 11px),
    linear-gradient(180deg,#2c1d15 0%,#1e140f 70%,#160f0b 100%)}
.shelf::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(90deg,#120b07 0,#2e1f15 20px,rgba(0,0,0,0) 34px,rgba(0,0,0,0) calc(100% - 34px),#2e1f15 calc(100% - 20px),#120b07 100%)}
.lights{position:absolute;left:0;top:0;width:100%;height:110px;overflow:visible;z-index:2}
.lights path{fill:none;stroke:rgba(255,235,200,.3);stroke-width:1.5}
.lights circle{animation:tw 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 0 5px currentColor)}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.sh-title{position:absolute;left:0;right:0;top:38px;text-align:center;font-family:'Caveat Brush',cursive;font-size:66px;line-height:1;color:#ffe9c7;text-shadow:0 0 26px rgba(255,190,110,.45);z-index:2}
.sh-sub{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,233,199,.55);z-index:2}
.motes{position:absolute;inset:0;z-index:1;pointer-events:none}
.motes span{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffd89a;box-shadow:0 0 8px 2px rgba(255,200,120,.55);opacity:0;animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-560px);opacity:0}}
.plank{position:absolute;left:0;right:0;top:486px;height:24px;z-index:2;background:linear-gradient(180deg,#7a5639 0,#563924 55%,#3a261b 100%);box-shadow:0 12px 20px rgba(0,0,0,.6)}
.plank::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,220,170,.25)}
.lower{position:absolute;left:0;right:0;top:510px;bottom:0;background:linear-gradient(180deg,#0f0a07,#1a110c)}
.books{position:absolute;left:40px;right:40px;bottom:118.7px;display:flex;align-items:flex-end;justify-content:center;gap:3px;z-index:3}

.bk{position:relative;flex:none;width:var(--w);height:var(--h);border-radius:3px 3px 2px 2px;
  background:linear-gradient(90deg,rgba(0,0,0,.38) 0,rgba(255,255,255,.14) 14%,rgba(255,255,255,0) 34%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.34) 100%),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),3px 0 6px rgba(0,0,0,.35)}
.bk::before{content:'';position:absolute;left:0;right:0;top:16px;height:5px;background:rgba(0,0,0,.25);box-shadow:0 calc(var(--h) - 46px) 0 rgba(0,0,0,.25)}
.bk.deco:nth-child(3n)::after{content:'';position:absolute;left:22%;right:22%;top:36%;height:38px;background:rgba(255,240,215,.7);border-radius:1px}
.bk.lean{transform:rotate(-6deg);transform-origin:100% 100%;margin:0 8px 0 22px}
.stack{flex:none;display:flex;flex-direction:column;align-items:center;margin-right:14px}
.stack i{display:block;width:var(--w);height:22px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.3)),var(--c);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.stack i:nth-child(2){margin-left:10px}
.bk.mem{border:0;padding:0;cursor:pointer;color:#f3d38a;transition:transform .5s var(--ease),box-shadow .5s}
.bk.mem::before{background:#e2bd63;height:4px;box-shadow:0 7px 0 #e2bd63,0 calc(var(--h) - 42px) 0 #e2bd63,0 calc(var(--h) - 35px) 0 #e2bd63}
.bk-n{position:absolute;top:36px;left:0;right:0;text-align:center;font:400 26px/1 'Caveat Brush',cursive}
.bk-t{position:absolute;left:50%;top:calc(50% - 3px);transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:400 22px/1 Anton,sans-serif;letter-spacing:.08em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.bk-h{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:18px;line-height:1}
.bk.mem:hover{transform:translateY(-8px)}
.bk.mem.sel{transform:translateY(-18px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),3px 0 6px rgba(0,0,0,.35),0 0 46px 6px color-mix(in srgb,var(--c) 60%,#ffd38a)}
.bk.mem.sel .bk-h{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.tapme{position:absolute;top:-38px;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 24px/1 'Caveat Brush',cursive;color:#ffe9c7;opacity:0;transition:opacity .4s;pointer-events:none}
.bk.mem.sel .tapme{opacity:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

.cake{position:relative;flex:none;width:96px;height:150px;margin-left:18px}
.cake i{position:absolute;display:block}
.cake .cp{bottom:0;left:0;width:96px;height:9px;border-radius:50%;background:#e9e2d6;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.cake .t1{bottom:5px;left:8px;width:80px;height:44px;border-radius:6px 6px 3px 3px;background:radial-gradient(circle at 10px 10px,#f7c6d0 7px,transparent 7.5px) 0 0/20px 20px repeat-x,linear-gradient(180deg,#f7c6d0 0 9px,#fbeee4 9px)}
.cake .t2{bottom:49px;left:20px;width:56px;height:34px;border-radius:6px 6px 3px 3px;background:radial-gradient(circle at 7px 8px,#e5566f 5px,transparent 5.5px) 0 0/14px 16px repeat-x,linear-gradient(180deg,#e5566f 0 7px,#fff4ec 7px)}
.cake .cd{bottom:83px;left:45px;width:6px;height:28px;border-radius:2px;background:repeating-linear-gradient(45deg,#fff 0 4px,#e5566f 4px 8px)}
.cake .fl{bottom:110px;left:42px;width:12px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff 0,#ffd36b 35%,#ff8a2b 75%,transparent 80%);box-shadow:0 0 22px 8px rgba(255,170,70,.45);
  transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .2s}
@keyframes flick{to{transform:scale(.9,1.1) rotate(3deg)}}
.cake.blown .fl{opacity:0}

/* ---------- viewport UI ---------- */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.ui button{pointer-events:auto}
.js .pre{opacity:0}
.tag{position:absolute;display:inline-flex;align-items:center;height:calc(37 * var(--n));padding:0 calc(18 * var(--n));
  background:#fff;color:var(--ink);border:0;border-radius:0;cursor:pointer;white-space:nowrap;
  font:650 calc(16.5 * var(--n))/1 'Inter Tight',sans-serif;letter-spacing:-.02em;
  box-shadow:0 calc(3 * var(--n)) 0 rgba(0,0,0,.18),0 calc(6 * var(--n)) calc(14 * var(--n)) rgba(0,0,0,.18);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tag:hover{transform:translateY(calc(-2 * var(--n))) rotate(-1.5deg);box-shadow:0 calc(5 * var(--n)) 0 rgba(0,0,0,.22),0 calc(10 * var(--n)) calc(18 * var(--n)) rgba(0,0,0,.2)}
.tag:active{transform:translateY(calc(1 * var(--n)));box-shadow:0 calc(1 * var(--n)) 0 rgba(0,0,0,.18)}
.t1{left:calc(30 * var(--n));top:calc(7 * var(--n))}
.t2{left:calc(233 * var(--n));top:calc(7 * var(--n))}
.t3{right:calc(244 * var(--n));top:calc(7 * var(--n))}
.t4{right:calc(32 * var(--n));top:calc(7 * var(--n))}
.logo{position:absolute;left:50%;top:calc(14 * var(--n));transform:translateX(-50%);background:none;border:0;cursor:pointer;color:#fff;
  font-weight:600;font-size:calc(19 * var(--n));letter-spacing:.14em;opacity:0;transition:opacity .4s;white-space:nowrap}
.ui .logo{pointer-events:none}
.is-case .ui .logo{opacity:1;pointer-events:auto}
.hint{position:absolute;left:50%;bottom:calc(22 * var(--n));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(10 * var(--n));
  font-size:calc(12 * var(--n));letter-spacing:.18em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.hint i{position:relative;display:block;width:calc(1.5 * var(--n));height:calc(22 * var(--n));background:rgba(255,255,255,.35);overflow:hidden}
.hint i::after{content:'';position:absolute;left:0;top:-40%;width:100%;height:40%;background:#fff;animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes drip{to{top:100%}}
.is-case .hint,.busy .hint{visibility:hidden}

.ticket{position:absolute;right:calc(32 * var(--n));top:calc(98 * var(--n));width:calc(348 * var(--n));height:calc(182 * var(--n));
  background:#fff;color:var(--ink);border-radius:calc(3 * var(--n));box-shadow:0 calc(18 * var(--n)) calc(40 * var(--n)) rgba(0,0,0,.28);
  padding:calc(26 * var(--n)) calc(34 * var(--n)) 0 calc(44 * var(--n));transform-origin:50% 0;opacity:0}
.hole{position:absolute;width:calc(21 * var(--n));height:calc(21 * var(--n));border-radius:50%;background:#2a1840;box-shadow:inset 0 calc(2 * var(--n)) calc(3 * var(--n)) rgba(0,0,0,.35)}
.h1{left:calc(12 * var(--n));top:calc(12 * var(--n))}.h2{right:calc(12 * var(--n));top:calc(12 * var(--n))}
.h3{left:calc(12 * var(--n));bottom:calc(12 * var(--n))}.h4{right:calc(12 * var(--n));bottom:calc(12 * var(--n))}
.ticket h2{margin:0;font:400 calc(50 * var(--n))/1 Anton,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.ticket .rows{margin-top:calc(8 * var(--n))}
.ticket .rows div{text-align:right;font-weight:700;font-size:calc(12 * var(--n));letter-spacing:.02em;padding:calc(4 * var(--n)) 0 calc(3 * var(--n));border-bottom:1.5px dotted #2a2a2a}
.desc{display:none!important;position:absolute;left:calc(28 * var(--n));top:calc(326 * var(--n));width:calc(172 * var(--n))}
.desc>*{opacity:0}
.desc .k{font-weight:700;font-size:calc(17 * var(--n));letter-spacing:-.02em}
.desc p{margin:calc(14 * var(--n)) 0 0;font-size:calc(15 * var(--n));line-height:1.36;font-weight:500;color:rgba(255,255,255,.92)}
.desc .num{margin-top:calc(22 * var(--n));font-size:calc(12 * var(--n));letter-spacing:.16em;font-weight:700;color:rgba(255,255,255,.7)}

.nav-case{position:absolute;bottom:calc(150 * var(--n));display:flex;flex-direction:column;align-items:center;gap:calc(9 * var(--n));background:none;border:0;cursor:pointer;color:#fff;
  font-weight:600;font-size:calc(15 * var(--n));line-height:1.05;text-align:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.is-case .nav-case{opacity:1;visibility:visible}
.nav-case.prev{left:calc(95 * var(--n))}.nav-case.next{right:calc(95 * var(--n))}
.nav-case .c{width:calc(50 * var(--n));height:calc(50 * var(--n));border-radius:50%;border:1.6px solid rgba(255,255,255,.9);display:grid;place-items:center;transition:transform .25s var(--ease),background .25s}
.nav-case svg{width:calc(24 * var(--n));height:calc(24 * var(--n));fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-case.next .c{background:#fff;color:#2a1840}
.nav-case.next:hover .c{background:var(--mint)}
.nav-case:hover .c{transform:scale(1.08)}
.m-only{display:none}

/* ---------- reader (opened book) ---------- */
.reader{position:fixed;inset:0;z-index:40;display:grid;place-items:center;visibility:hidden;pointer-events:none}
.reader.show{visibility:visible;pointer-events:auto}
.rd-bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(40,20,60,.72),rgba(12,6,24,.94));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .45s}
.reader.show .rd-bg{opacity:1}
.rd-wrap{position:relative;perspective:2400px;opacity:0;transform:translateY(50px) scale(.72);transition:opacity .45s,transform .6s var(--ease)}
.reader.show .rd-wrap{opacity:1;transform:none}
.rd-book{--bw:min(980px,88vw,calc(74vh * 1.5));--bc:#b03a4e;position:relative;width:var(--bw);height:calc(var(--bw) / 1.5);transform-style:preserve-3d;transform:translateX(-25%);transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.reader.open .rd-book{transform:none}
.rd-right{position:absolute;left:50%;top:0;width:50%;height:100%;border-radius:0 8px 8px 0;color:#2b2320;
  background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0) 9%),#fbf6ec;
  box-shadow:3px 0 0 #ebe2d1,6px 0 0 #dbd1bd,9px 1px 0 #cfc4ae,0 30px 60px rgba(0,0,0,.45)}
.rd-scroll{height:100%;overflow-y:auto;padding:9% 10% 8%;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.2) transparent}
.pg-in>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s var(--ease)}
.reader.open .pg-in>*{opacity:1;transform:none}

  kill(screen); screen.style.opacity = 0;
  body.classList.remove('is-case'); mode = 'hero'; layoutTags();
  root.style.setProperty('--glide', '.9s'); frame.classList.add('glide'); place('hero');
  plate.style.visibility = 'visible';
  kill(cut); cut.style.opacity = 0;
  an(cut, [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 150 }).then(() => { cut.style.opacity = 1; kill(cut); });
  kill(caseplate);
  an(caseplate, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(12px)' }], { duration: 800, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' })
    .then(() => { caseplate.style.opacity = 0; kill(caseplate); });
  an($('.bg'), [{ opacity: 0 }, { opacity: 1 }], { duration: 900, fill: 'none' });
  setTimeout(heroIn, D(250));
  setTimeout(() => { busy = false; body.classList.remove('busy'); frame.classList.remove('glide'); }, D(1000));
}

/* ---------------- the book reader ---------------- */
function fillReader(i) {
  const m = CONFIG.memories[i];
  rBook.style.setProperty('--bc', m.color);
  $('.cv-n').textContent = 'core memory · ' + pad(i + 1);
  $('.cv-t').textContent = m.title;
  $('.cv-f').textContent = 'for ' + CONFIG.name.toLowerCase();
  const img = $('.pol-img');
  const pol = $('.polaroid');
  pol.classList.toggle('tall', !!m.photoRatio && m.photoRatio <= 1);
  pol.classList.toggle('wide', !!m.photoRatio && m.photoRatio > 1);
  pol.style.setProperty('--ar', m.photoRatio || 1);
  if (m.photo) { img.style.backgroundImage = `url("${m.photo}")`; img.style.backgroundPosition = m.photoPos || '50% 50%'; img.textContent = ''; }
  else { img.style.backgroundImage = ''; img.innerHTML = '♡<br>a photo of you two<br>goes here'; }
  $('.pol-cap').textContent = m.caption || '';
  $('.pg-k').textContent = m.spine.toLowerCase() + '  ·  ' + pad(i + 1) + ' / ' + pad(N);
  $('.pg-t').textContent = m.title;
  $('.pg-body').innerHTML = m.message.split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  $('.pg-sign').textContent = m.sign || '';
  $('.rd-count').textContent = pad(i + 1) + ' / ' + pad(N);
  $('.rd-scroll').scrollTop = 0;
}
async function openBook(i) {
  if (busy || rOpen || mode !== 'case') return;
  rOpen = true; rBusy = true; rIdx = i;
  if (i !== sel) { sel = i; fillCase(i); }
  an(memBooks[i], [{ transform: 'translateY(-18px)' }, { transform: 'translateY(-70px) scale(1.06)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'none' });
  fillReader(i);
  reader.classList.add('show'); reader.setAttribute('aria-hidden', 'false');
  await wait(D(520));
  reader.classList.add('open');
  setTimeout(() => burst(innerWidth / 2, innerHeight * .3, 70, -Math.PI / 2, 2.6, 13), D(600));
  await wait(D(1100));
  rBusy = false;
  $('.rd-close').focus({ preventScroll: true });
}
async function closeReader() {
  if (!rOpen || rBusy) return;
  rBusy = true;
  reader.classList.remove('open');
  await wait(D(900));
  reader.classList.remove('show');
  await wait(D(450));
  reader.setAttribute('aria-hidden', 'true');
  rOpen = false; rBusy = false;
}
async function turnReader(d) {
  if (!rOpen || rBusy) return;
  rBusy = true;
  reader.classList.remove('open');
  await wait(D(1000));
  rIdx = (rIdx + d + N) % N; sel = rIdx; fillCase(sel); fillReader(rIdx);
  await wait(D(60));
  reader.classList.add('open');
  await wait(D(1100));
  rBusy = false;
}

/* ---------------- confetti + wish ---------------- */
const cv = $('.confetti'), cx = cv.getContext('2d');
let P = [], running = false;
function sizeCv() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
sizeCv();
const CC = ['#ffd36b', '#f7c6d0', '#cfeee0', '#ffffff', '#e5566f', '#9fd8bf'];
function burst(x, y, n, ang, spr, pow) {
  if (RM) return;
  const k = Math.min(1.2, Math.max(.6, innerHeight / 900));
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() - .5) * spr, v = pow * k * (.55 + Math.random() * .6);
    P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: CC[i % CC.length], t: 0, f: Math.random() * 6.28 });
  }
  if (!running) { running = true; requestAnimationFrame(step); }
}
function step() {
  const W = innerWidth, H = innerHeight;
  cx.clearRect(0, 0, W, H);
  P = P.filter(p => p.y < H + 40 && p.t < 420);
  for (const p of P) {
    p.t++; p.vy += .28; p.vx *= .985; p.vy *= .985;
    p.x += p.vx + Math.sin(p.t * .08 + p.f) * .6; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.scale(1, Math.cos(p.t * .12 + p.f));
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  if (P.length) requestAnimationFrame(step); else { running = false; cx.clearRect(0, 0, W, H); }
}
function party() { const W = innerWidth, H = innerHeight; burst(0, H * .92, 90, -Math.PI / 3, .9, 22); burst(W, H * .92, 90, -Math.PI * 2 / 3, .9, 22); }
let toastT;
function toast(msg) { const t = $('.toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function wish() {
  party(); toast('make a wish ✦');
}

/* ---------------- input ---------------- */
$('.t1').addEventListener('click', () => toHero());
$('.logo').addEventListener('click', () => toHero());
$('.t2').addEventListener('click', () => toCase());

$('.t4').addEventListener('click', async () => {
  if (mode === 'hero') { await toCase(); await wait(D(800)); }
  openBook(sel);
});
prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);
memBooks.forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openBook(+b.dataset.i); }));
$('.rd-close').addEventListener('click', closeReader);
$('.rd-bg').addEventListener('click', closeReader);
$('.rd-prev').addEventListener('click', () => turnReader(-1));
$('.rd-next').addEventListener('click', () => turnReader(1));

let wheelLock = 0;
addEventListener('wheel', e => {
  if (rOpen) { if (e.target.closest && e.target.closest('.rd-scroll')) return; e.preventDefault(); return; }
  e.preventDefault();
  if (Math.abs(e.deltaY) < 18) return;
  const now = Date.now(); if (now < wheelLock) return; wheelLock = now + 900;
  if (mode === 'hero') { if (e.deltaY > 0) toCase(); }
  else e.deltaY > 0 ? next() : prev();
}, { passive: false });

let ts = null;
addEventListener('touchstart', e => { const t = e.touches[0]; ts = { x: t.clientX, y: t.clientY }; }, { passive: true });
addEventListener('touchmove', e => { if (rOpen && e.target.closest && e.target.closest('.rd-scroll')) return; e.preventDefault(); }, { passive: false });
addEventListener('touchend', e => {
  if (!ts) return;
  const t = e.changedTouches[0], dx = t.clientX - ts.x, dy = t.clientY - ts.y; ts = null;
  if (rOpen) { if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turnReader(dx < 0 ? 1 : -1); return; }
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  if (mode === 'hero') { if (dy <= -40 && Math.abs(dy) > Math.abs(dx)) toCase(); }
  else if (Math.abs(dy) > Math.abs(dx)) dy < 0 ? next() : prev();
  else dx < 0 ? next() : prev();
});

addEventListener('keydown', e => {
  const k = e.key;
  if (rOpen) {
    if (k === 'Escape') closeReader();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); turnReader(1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); turnReader(-1); }
    return;
  }
  if (mode === 'hero') {
    if (k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); toCase(); }
  } else {
    if (k === 'ArrowDown' || k === 'PageDown' || k === 'ArrowRight') { e.preventDefault(); next(); }
    else if (k === 'ArrowUp' || k === 'PageUp' || k === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); openBook(sel); }
    else if (k === 'Escape') toHero();
  }
});

// phones: spread the top buttons evenly across one row
function layoutTags() {
  const tags = ['.t1', '.t2', '.t4'].map(s => $(s)).filter(t => t && !(t.matches('.t4') && body.classList.contains('is-case')));
  if (!isM()) { tags.forEach(t => { t.style.left = t.style.right = ''; }); return; }
  const pad = 12, widths = tags.map(t => t.offsetWidth), gap = (innerWidth - 2 * pad - widths.reduce((a, b) => a + b, 0)) / (tags.length - 1);
  let x = pad;
  tags.forEach((t, k) => { t.style.right = 'auto'; t.style.left = x + 'px'; x += widths[k] + gap; });
}
layoutTags();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutTags);
addEventListener('resize', () => { frame.classList.remove('glide'); place(poseMode); sizeCv(); fitTitle(); layoutTags(); });

/* ---------------- go ---------------- */
fillCase(0);
place('hero');
</script>
